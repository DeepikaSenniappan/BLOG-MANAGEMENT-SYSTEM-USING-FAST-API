<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sample Mailtrap Blog Notification Email</title>
  <desc id="desc">A realistic email testing inbox mockup showing a sample FastAPI blog comment notification. This is a demo mockup, not a live Mailtrap capture.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#182230" flood-opacity=".09"/></filter>
    <style>
      .ui{font:14px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.muted{fill:#8793a3}.tiny{font:12px Inter,'Segoe UI',Arial,sans-serif;fill:#667085}.strong{font-weight:650;fill:#172b4d}.mono{font:13px Consolas,monospace;fill:#334155}
      .label{font:11px Inter,'Segoe UI',Arial,sans-serif;font-weight:700;letter-spacing:.7px;fill:#8693a5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f4f6f8"/>
  <!-- top bar -->
  <rect width="1600" height="64" fill="#fff"/>
  <path d="M0 63.5H1600" stroke="#e6e9ee"/>
  <path d="M31 26h14l8 7-8 7H31z" fill="#19a974"/><path d="M31 26v14" stroke="#0f8258" stroke-width="3"/>
  <text x="63" y="40" class="ui strong" font-size="19">mailtrap</text>
  <text x="248" y="39" class="ui muted">Email Testing</text><path d="m355 34 5 5 5-5" fill="none" stroke="#98a2b3" stroke-width="1.5"/>
  <text x="1420" y="39" class="ui">Demo Workspace</text><circle cx="1550" cy="32" r="17" fill="#e8efff"/><text x="1550" y="37" text-anchor="middle" class="ui strong">D</text>
  <!-- sidebar -->
  <rect x="0" y="64" width="236" height="936" fill="#fff"/><path d="M235.5 64V1000" stroke="#e6e9ee"/>
  <text x="25" y="111" class="label">WORKSPACE</text>
  <rect x="14" y="131" width="208" height="42" rx="7" fill="#f1f5f9"/><circle cx="34" cy="152" r="7" fill="#7b61ff"/><text x="52" y="157" class="ui strong">My Project</text><path d="m198 148 5 5-5 5" fill="none" stroke="#7d8998" stroke-width="1.5"/>
  <text x="25" y="216" class="label">EMAIL TESTING</text>
  <rect x="12" y="231" width="212" height="41" rx="7" fill="#e8f7f1"/><path d="M29 245h15v13H29zM29 245l7.5 6 7.5-6" fill="none" stroke="#11966a" stroke-width="1.6"/><text x="55" y="257" class="ui" fill="#087d57" font-weight="650">Sandboxes</text>
  <text x="52" y="302" class="ui">Email API</text>
  <text x="25" y="362" class="label">SANDBOXES</text>
  <circle cx="34" cy="393" r="6" fill="#18a878"/><text x="52" y="398" class="ui strong">My Sandbox</text><text x="193" y="398" class="tiny">1</text>
  <text x="25" y="958" class="tiny">Help Center</text><text x="119" y="958" class="tiny">Documentation</text>
  <!-- main toolbar -->
  <text x="274" y="108" class="ui strong" font-size="23">My Sandbox</text>
  <rect x="1364" y="81" width="191" height="39" rx="7" fill="#fff" stroke="#dce2e9"/><text x="1390" y="106" class="ui">Integration</text><path d="m1528 97 5 5 5-5" fill="none" stroke="#7c8795" stroke-width="1.5"/>
  <text x="275" y="151" class="ui" fill="#13815f" font-weight="650">Inbox</text><path d="M270 164h50" stroke="#19a974" stroke-width="3"/>
  <text x="344" y="151" class="ui muted">Settings</text><path d="M260 166H1574" stroke="#e2e7ed"/>
  <!-- email list card -->
  <rect x="260" y="188" width="408" height="760" rx="10" fill="#fff" stroke="#e0e5eb" filter="url(#shadow)"/>
  <rect x="260" y="188" width="408" height="58" rx="10" fill="#fff"/><path d="M260 246H668" stroke="#edf0f3"/>
  <text x="284" y="223" class="ui strong">Messages</text><text x="601" y="223" class="tiny">1 message</text>
  <rect x="277" y="261" width="374" height="116" rx="8" fill="#f0faf6" stroke="#b9ead5"/>
  <circle cx="301" cy="287" r="7" fill="#18a878"/><text x="318" y="291" class="ui strong">John Doe liked your post</text>
  <text x="294" y="319" class="ui">Blog Notifications</text><text x="294" y="344" class="tiny">To: owner@example.com</text><text x="570" y="344" class="tiny">11:20 AM</text>
  <text x="294" y="365" class="tiny">FastAPI Best Practices</text>
  <rect x="260" y="188" width="408" height="760" rx="10" fill="none" stroke="#e0e5eb"/>
  <!-- message detail -->
  <rect x="690" y="188" width="884" height="760" rx="10" fill="#fff" stroke="#e0e5eb" filter="url(#shadow)"/>
  <rect x="690" y="188" width="884" height="67" rx="10" fill="#fff"/><path d="M690 254H1574" stroke="#edf0f3"/>
  <text x="722" y="228" class="ui strong" font-size="17">John Doe liked your post</text>
  <rect x="1442" y="205" width="101" height="29" rx="14" fill="#e9f8f1"/><circle cx="1459" cy="219" r="4" fill="#15966b"/><text x="1470" y="223" class="tiny" fill="#13815f">Delivered</text>
  <text x="722" y="293" class="label">FROM</text><text x="780" y="293" class="ui">Blog Notifications &lt;notifications@example.com&gt;</text>
  <text x="722" y="327" class="label">TO</text><text x="780" y="327" class="ui">owner@example.com</text>
  <text x="722" y="361" class="label">DATE</text><text x="780" y="361" class="ui">Oct 6, 2026, 11:20 AM</text>
  <path d="M722 387H1542" stroke="#edf0f3"/>
  <rect x="722" y="414" width="820" height="271" rx="8" fill="#fbfcfe" stroke="#e9edf2"/>
  <text x="754" y="456" class="mono">Post: FastAPI Best Practices</text>
  <text x="754" y="501" class="mono">User: John Doe</text>
  <text x="754" y="546" class="mono">Activity: Liked your post</text>
  <text x="754" y="591" class="mono">Time: 2026-10-06 11:20 AM UTC</text>
  <rect x="722" y="718" width="820" height="1" fill="#edf0f3"/>
  <text x="722" y="755" class="label">MESSAGE INSPECTOR</text>
  <rect x="722" y="773" width="820" height="54" rx="7" fill="#f8fafc" stroke="#e8edf2"/>
  <text x="742" y="806" class="tiny">HTML</text><text x="798" y="806" class="tiny">Plain text</text><text x="895" y="806" class="tiny">Headers</text>
  <!-- explicit demo marker -->
  <rect x="1315" y="906" width="226" height="26" rx="13" fill="#fff4db" stroke="#f0d38c"/><text x="1428" y="923" text-anchor="middle" font="700 11px Inter,'Segoe UI',Arial,sans-serif" fill="#855b08" letter-spacing=".4">SAMPLE MOCKUP • NOT A LIVE CAPTURE</text>
</svg>
